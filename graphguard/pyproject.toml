[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "graphguard"
version = "0.1.0"
description = "Evidence-backed change intelligence powered by Entire Graph"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
databricks = ["databricks-sdk>=0.20", "mlflow>=2.10", "delta-spark>=3.0"]

[project.scripts]
graphguard = "graphguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
